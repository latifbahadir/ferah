name: PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    steps:
      - name: PR bir issue'ya bağlı mı?
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo "✓ Issue bağlantısı bulundu."
          else
            echo "::error::PR açıklamasında 'Closes #<issue>' satırı bulunmalı. Her PR bir issue'ya yönelik olmalıdır."
            exit 1
          fi
