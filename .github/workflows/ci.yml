name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Swift sürümü
        run: swift --version

      - name: Yasaklı API denetimi (ADR-0002/0003)
        run: scripts/check-forbidden-apis.sh

      - name: Biçim denetimi (swift-format)
        if: hashFiles('.swift-format') != ''
        run: swift format lint --strict --recursive Package.swift Sources Tests App

      - name: FerahCore derle ve test et
        if: hashFiles('Package.swift') != ''
        run: swift test

      - name: ferah CLI çalışıyor mu?
        if: hashFiles('Package.swift') != ''
        run: swift run ferah --version

      - name: Ferah.app derle
        if: hashFiles('App/Ferah.xcodeproj/project.pbxproj') != ''
        run: |
          xcodebuild -project App/Ferah.xcodeproj -scheme Ferah -configuration Debug \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build

      - name: Henüz Swift paketi yok
        if: hashFiles('Package.swift') == ''
        run: echo "Package.swift bulunamadı; derleme adımı atlandı."
